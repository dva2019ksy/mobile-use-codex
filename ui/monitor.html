<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobile Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --fg: #22252a;
      --muted: #6c717b;
      --glass: rgb(255 255 255 / 66%);
      --edge: rgb(255 255 255 / 90%);
      --line: rgb(35 43 55 / 10%);
      --hover: rgb(35 43 55 / 7%);
      --accent: #227b57;
      --display-bg: #e9ecf1;
      --shadow: 0 12px 36px rgb(30 40 60 / 10%), inset 0 1px 0 rgb(255 255 255 / 70%);
      --screen-shadow: 0 24px 64px rgb(30 40 60 / 16%), 0 2px 8px rgb(30 40 60 / 8%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181b;
        --fg: #f1f2f4;
        --muted: #9c9fa9;
        --glass: rgb(47 49 55 / 64%);
        --edge: rgb(255 255 255 / 15%);
        --line: rgb(255 255 255 / 10%);
        --hover: rgb(255 255 255 / 9%);
        --accent: #80d8ac;
        --display-bg: #1c1e23;
        --shadow: 0 12px 36px rgb(0 0 0 / 22%), inset 0 1px 0 rgb(255 255 255 / 9%);
        --screen-shadow: 0 24px 64px rgb(0 0 0 / 35%), 0 2px 8px rgb(0 0 0 / 20%);
      }
    }
    * {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }
    body {
      margin: 0;
      height: 100dvh;
      min-height: 300px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 15% 5%, rgb(151 171 205 / 9%), transparent 55%),
        radial-gradient(ellipse at 90% 90%, rgb(160 190 184 / 7%), transparent 50%), var(--bg);
      font:
        12px -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Inline hosts size the iframe from its content. A viewport-based content
       height feeds that measurement back into the iframe's own height. */
    html[data-hosted='true'] body[data-mode='inline'] {
      height: 96px;
      min-height: 0;
      grid-template-rows: 1fr;
    }
    html[data-hosted='true'] body[data-mode='inline'] header {
      padding: 20px 24px;
    }
    html[data-hosted='true'] body[data-mode='inline'] main,
    html[data-hosted='true'] body[data-mode='inline'] footer,
    body[data-state='ended'] .spinner {
      display: none;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 24px 12px;
      min-width: 0;
    }
    .device-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--edge);
      border-radius: 12px;
      background: var(--glass);
      flex-shrink: 0;
    }
    .identity {
      min-width: 0;
      flex: 1;
    }
    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.4px;
    }
    #device {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }
    .connection {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    #dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    body[data-state='live'] .connection {
      color: var(--accent);
    }
    main {
      position: relative;
      min-width: 0;
      min-height: 0;
      margin: 12px 24px 20px;
    }
    #screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #device-shell {
      position: relative;
      flex: none;
      max-width: 96%;
      max-height: 96%;
      padding: var(--bezel, 14px);
      border: 1px solid #696c72;
      border-radius: 28px;
      background: linear-gradient(135deg, #36383c, #111214 45%, #25272a);
      box-shadow:
        0 28px 70px rgb(0 0 0 / 28%),
        0 4px 12px rgb(0 0 0 / 16%),
        inset 0 0 0 1px rgb(255 255 255 / 16%),
        inset 0 2px 2px rgb(255 255 255 / 12%);
    }
    .camera {
      position: absolute;
      top: calc(var(--bezel, 14px) / 2 - 2px);
      left: calc(50% - 2px);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #080a0d;
      box-shadow:
        inset 0 0 0 1px #323944,
        inset 1px 1px 1px #536278;
    }
    #device-shell[data-orientation='landscape'] .camera {
      top: calc(50% - 2px);
      left: calc(var(--bezel, 14px) / 2 - 2px);
    }
    #display {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: var(--display-bg);
      box-shadow: 0 0 0 1px rgb(0 0 0 / 65%);
      container-type: size;
    }
    #display img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    #display[data-interactive='true'] {
      cursor: pointer;
      touch-action: manipulation;
    }
    .tap-ring {
      position: absolute;
      z-index: 3;
      width: 28px;
      height: 28px;
      margin: -14px;
      pointer-events: none;
      border: 1.5px solid rgb(255 255 255 / 90%);
      border-radius: 50%;
      background: rgb(255 255 255 / 18%);
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 20%),
        0 2px 12px rgb(0 0 0 / 25%);
      animation: tap-feedback 450ms ease-out both;
    }
    @keyframes tap-feedback {
      from {
        opacity: 1;
        transform: scale(0.65);
      }
      to {
        opacity: 0;
        transform: scale(1.5);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .tap-ring {
        animation: none;
      }
    }
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      flex: none;
      width: 21px;
      height: 21px;
      margin-bottom: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #placeholder-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    #placeholder-detail {
      color: var(--muted);
      line-height: 1.7;
      max-width: 280px;
      margin: 0;
      overflow-wrap: anywhere;
    }
    @container (max-height: 140px) {
      #placeholder {
        padding: 8px;
      }
      #placeholder-detail {
        display: none;
      }
      .spinner {
        margin-bottom: 12px;
      }
    }
    @container (max-height: 80px) {
      #placeholder-title {
        display: none;
      }
      .spinner {
        margin-bottom: 0;
      }
    }
    body[data-state='error'] .spinner,
    body[data-state='ended'] .spinner,
    body[data-state='paused'] .spinner {
      animation: none;
      border-color: var(--line);
    }
    #overlay {
      position: absolute;
      inset: auto 0 8px;
      margin: auto;
      width: max-content;
      max-width: 90%;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--edge);
      color: var(--fg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    footer {
      padding: 0 16px max(14px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .dock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: linear-gradient(145deg, rgb(255 255 255 / 12%), transparent 55%), var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }
    button {
      position: relative;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 12px;
      cursor: pointer;
      font: inherit;
      font-size: 10px;
      white-space: nowrap;
      transition:
        background 150ms,
        transform 150ms;
    }
    button:hover:not(:disabled) {
      background: var(--hover);
    }
    button:active:not(:disabled) {
      transform: scale(0.94);
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    button[aria-pressed='true'] {
      background: var(--hover);
    }
    button[aria-busy='true'] svg {
      opacity: 0;
    }
    button[aria-busy='true']::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--line);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    button[aria-busy='true']:disabled {
      opacity: 1;
    }
    svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .divider {
      height: 26px;
      width: 1px;
      background: var(--line);
      margin: 0 5px;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 26px;
      padding-top: 10px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    #feedback {
      color: var(--fg);
      overflow-wrap: anywhere;
    }
    #feedback:empty {
      display: none;
    }
    #rate {
      opacity: 0.85;
    }
    .symbols {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    @media (max-width: 380px) {
      header {
        padding: 16px 16px 8px;
      }
      main {
        margin: 8px 12px 16px;
      }
      footer {
        padding-inline: 8px;
      }
      button {
        width: 42px;
        height: 42px;
        padding: 11px;
      }
      .divider {
        margin-inline: 2px;
      }
      .dock {
        gap: 2px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
      button {
        transition: none;
      }
    }
  </style>
  <body data-mode="inline" data-state="loading" data-plugin-version="__PLUGIN_VERSION__">
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-device" viewBox="0 0 24 24">
        <rect x="5" y="2.5" width="14" height="19" rx="3" />
        <path d="M10 18.5h4" />
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4zM16 12h6" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="m11 5-5 4H3v6h3l5 4zM16 12h6m-3-3v6" />
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7M5.5 8.5V20h5v-6h3v6h5V8.5" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M8 5v14M16 5v14" stroke-width="2.5" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z" /></symbol>
      <symbol id="icon-retry" viewBox="0 0 24 24">
        <path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6" />
      </symbol>
    </svg>
    <header>
      <div class="device-icon">
        <svg aria-hidden="true"><use href="#icon-device" /></svg>
      </div>
      <div class="identity">
        <span class="eyebrow">MOBILE MONITOR</span>
        <strong id="device">设备监看</strong>
      </div>
      <div class="connection" role="status">
        <i id="dot" aria-hidden="true"></i>
        <span id="status">正在连接</span>
      </div>
    </header>
    <main id="view" aria-label="设备实时画面" aria-busy="true">
      <div id="screen">
        <div id="device-shell" hidden>
          <i class="camera" aria-hidden="true"></i>
          <div id="display">
            <div id="placeholder" role="status">
              <div class="spinner" aria-hidden="true"></div>
              <p id="placeholder-title">正在连接设备</p>
              <p id="placeholder-detail">画面就绪后将在这里显示</p>
            </div>
          </div>
        </div>
      </div>
      <div id="overlay" hidden></div>
    </main>
    <footer>
      <div class="dock" role="toolbar" aria-label="设备与监看控制">
        <button
          id="volume-down"
          data-button="VOLUME_DOWN"
          title="降低设备音量"
          aria-label="降低设备音量"
          disabled
        >
          <svg aria-hidden="true"><use href="#icon-minus" /></svg>
        </button>
        <button
          id="home"
          data-button="HOME"
          title="返回设备主屏幕"
          aria-label="返回设备主屏幕"
          disabled
        >
          <svg aria-hidden="true"><use href="#icon-home" /></svg>
        </button>
        <button
          id="volume-up"
          data-button="VOLUME_UP"
          title="提高设备音量"
          aria-label="提高设备音量"
          disabled
        >
          <svg aria-hidden="true"><use href="#icon-plus" /></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button id="toggle" title="暂停画面" aria-label="暂停画面" aria-pressed="false" disabled>
          <svg aria-hidden="true"><use href="#icon-pause" /></svg>
        </button>
      </div>
      <div class="meta">
        <span id="feedback" role="status"></span>
        <span id="rate">等待首帧</span>
      </div>
    </footer>
    <script>
      /* STANDALONE_CONFIG */
      if (parent !== window && !window.mobileCodexStandalone) {
        document.documentElement.dataset.hosted = 'true';
      }
      const $ = (selector) => document.querySelector(selector);
      const viewer =
        window.crypto?.randomUUID?.() ??
        'viewer-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      const pending = new Map();
      let config = null;
      let running = false;
      let image = null;
      let streamImage = null;
      let polling = false;
      let rpcId = 0;
      let bridgeReady = false;
      let generation = 0;
      let rendered = [];
      let ended = false;
      let disposed = false;
      let controlBusy = false;
      let displayedFrame = null;
      let frameReceivedAt = 0;
      let pointerStart = null;
      let feedbackTimer;
      let frameSize = [4, 3];
      function restoreFrameSize(device) {
        frameSize =
          !device || /ipad|tablet/i.test(device.name + ' ' + device.model) ? [4, 3] : [9, 16];
        try {
          const saved = JSON.parse(localStorage.getItem('mobile-monitor.size.' + device?.id));
          if (
            saved?.length === 2 &&
            saved.every((n) => Number.isFinite(n) && n > 0 && n <= 10000)
          ) {
            frameSize = saved;
          }
        } catch {
          /* Storage is optional in sandboxed hosts. */
        }
      }
      function fitDevice() {
        if (image?.naturalWidth && image.naturalHeight) {
          const nextSize = [image.naturalWidth, image.naturalHeight];
          if (nextSize[0] !== frameSize[0] || nextSize[1] !== frameSize[1]) {
            frameSize = nextSize;
            try {
              localStorage.setItem(
                'mobile-monitor.size.' + config?.device.id,
                JSON.stringify(frameSize),
              );
            } catch {
              /* Reconnection still retains this instance's last frame size. */
            }
          }
        }
        const [width, height] = frameSize;
        const area = $('#screen');
        const bezel = Math.max(10, Math.min(18, area.clientWidth * 0.022));
        const space = 2 * bezel + 2;
        const scale = Math.max(
          0,
          Math.min(
            (area.clientWidth * 0.96 - space) / width,
            (area.clientHeight * 0.96 - space) / height,
          ),
        );
        const shell = $('#device-shell');
        shell.style.setProperty('--bezel', bezel + 'px');
        shell.style.width = width * scale + space + 'px';
        shell.style.height = height * scale + space + 'px';
        shell.dataset.orientation = width > height ? 'landscape' : 'portrait';
        shell.hidden = false;
      }
      const resizeObserver = new ResizeObserver(fitDevice);
      resizeObserver.observe($('#screen'));
      function setStatus(text, state = 'loading') {
        const changed = document.body.dataset.state !== state;
        $('#status').textContent = text;
        document.body.dataset.state = state;
        if (changed) {
          updateControls();
        }
      }
      function placeholder(title, detail) {
        $('#placeholder-title').textContent = title;
        $('#placeholder-detail').textContent = detail;
        $('#placeholder').hidden = Boolean(image);
      }
      function toggleLabel(text, icon) {
        $('#toggle use').setAttribute('href', '#icon-' + icon);
        $('#toggle').setAttribute('aria-label', text + '画面');
        $('#toggle').title = text + '画面';
        $('#toggle').setAttribute('aria-pressed', String(text === '继续'));
      }
      function updateControls() {
        $('#toggle').disabled = !config || ended || disposed;
        document.querySelectorAll('[data-button]').forEach((button) => {
          button.disabled = !bridgeReady || !config || ended || disposed || controlBusy;
          if (window.mobileCodexStandalone) {
            button.title = '请在 Codex 监看面板中操作设备';
          }
        });
        $('#display').dataset.interactive = String(canTap());
      }
      function canTap() {
        return Boolean(
          bridgeReady &&
          !window.mobileCodexStandalone &&
          config &&
          running &&
          !ended &&
          !disposed &&
          !controlBusy &&
          image &&
          displayedFrame &&
          performance.now() - frameReceivedAt <= 2000 &&
          document.body.dataset.state === 'live',
        );
      }
      function feedback(text, persistent = false) {
        clearTimeout(feedbackTimer);
        $('#feedback').textContent = text;
        $('#rate').hidden = Boolean(text);
        if (!persistent) {
          feedbackTimer = setTimeout(() => {
            $('#feedback').textContent = '';
            $('#rate').hidden = false;
          }, 4000);
        }
      }
      function notify(method, params) {
        parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }
      function rpc(method, params, timeoutMs = 10000) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(Error('Codex bridge timeout'));
          }, timeoutMs);
          pending.set(id, { resolve, reject, timer });
          parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      async function callTool(name, args, timeoutMs = 10000) {
        const result = await rpc('tools/call', { name, arguments: args }, timeoutMs);
        if (result.isError) {
          throw Error(result.content?.find((c) => c.type === 'text')?.text || '操作失败');
        }
        return result;
      }
      function applyMode(mode) {
        if (!['inline', 'fullscreen'].includes(mode)) {
          return;
        }
        document.body.dataset.mode = mode;
      }
      async function displayMode(mode) {
        const response = window.openai?.requestDisplayMode
          ? await window.openai.requestDisplayMode({ mode })
          : await rpc('ui/request-display-mode', { mode });
        applyMode(response?.mode ?? window.openai?.displayMode ?? mode);
      }
      function stopStream() {
        if (!streamImage) {
          return;
        }
        if (image === streamImage) {
          // Preserve a still frame when pausing the diagnostic MJPEG stream.
          try {
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            canvas.getContext('2d').drawImage(image, 0, 0);
            const still = new Image();
            still.alt = image.alt;
            still.src = canvas.toDataURL('image/jpeg');
            image.replaceWith(still);
            image = still;
          } catch {
            image = null;
          }
        }
        streamImage.onload = null;
        streamImage.onerror = null;
        streamImage.src =
          'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        streamImage.remove();
        streamImage = null;
      }
      async function releaseViewer(device = config?.device.id) {
        if (bridgeReady && device) {
          try {
            await callTool('release_frame_viewer', { device, viewer });
          } catch {
            /* Abandoned viewers also expire on the server. */
          }
        }
      }
      function stopViewing() {
        running = false;
        displayedFrame = null;
        pointerStart = null;
        generation++;
        stopStream();
        void releaseViewer();
        $('#view').setAttribute('aria-busy', 'false');
      }
      async function finish() {
        if (ended || disposed) {
          return;
        }
        ended = true;
        stopViewing();
        clearInterval(statusTimer);
        image?.remove();
        image = null;
        fitDevice();
        $('#overlay').hidden = true;
        $('#rate').textContent = '采集已停止';
        setStatus('已结束', 'ended');
        placeholder('本次监看已结束', '设备操作完成，画面采集已停止');
        updateControls();
        // Historical widgets mount inline too. Rendering an ended card should
        // never reopen or close the host's current side panel.
        if (!window.mobileCodexStandalone && document.body.dataset.mode !== 'fullscreen') {
          return;
        }
        // requestClose is an optional host extension; inline closes the side panel on other hosts.
        try {
          if (window.openai?.requestClose) {
            await window.openai.requestClose();
            return;
          }
          if (window.mobileCodexStandalone) {
            window.close();
            return;
          }
        } catch {
          /* Fall back to closing the expanded panel. */
        }
        if (bridgeReady && !disposed && document.body.dataset.mode === 'fullscreen') {
          try {
            await displayMode('inline');
          } catch {
            feedback('监看已结束，可关闭此面板');
          }
        }
      }
      function fail(error) {
        if (ended || disposed) {
          return;
        }
        stopViewing();
        setStatus('连接中断', 'error');
        placeholder('暂时无法接收画面', error.message);
        $('#overlay').textContent = '连接中断 · 点击重连';
        $('#overlay').hidden = !image;
        $('#rate').textContent = '连接中断';
        toggleLabel('重连', 'retry');
      }
      function showRate(capture) {
        const now = performance.now();
        rendered.push(now);
        while (rendered.length > 120 || (rendered.length > 1 && rendered[0] < now - 2000)) {
          rendered.shift();
        }
        const fps = rendered.length > 1 ? ((rendered.length - 1) * 1000) / (now - rendered[0]) : 0;
        $('#rate').textContent =
          '采集 ' + capture.toFixed(1) + ' · 显示 ' + fps.toFixed(1) + ' fps';
        setStatus('实时', 'live');
      }
      async function streamFrames(current, device) {
        let after = 0;
        while (running && generation === current) {
          try {
            const result = await callTool('read_frame', { device, viewer, after, waitMs: 1000 });
            if (!running || generation !== current) {
              return;
            }
            const state = result.structuredContent;
            if (state?.activeOperations === 0) {
              await finish();
              return;
            }
            if (state?.error) {
              throw Error(state.error);
            }
            const frame = result._meta?.mobileCodexFrame;
            if (!frame) {
              if (!image) {
                setStatus('等待画面');
              }
              continue;
            }
            // Decode off-screen so neither a missing src nor an invalid frame can flash a broken image.
            const next = new Image();
            next.alt = config.device.name + ' 实时屏幕';
            next.src = 'data:image/jpeg;base64,' + frame.jpeg;
            await next.decode();
            if (!running || generation !== current) {
              return;
            }
            $('#display').append(next);
            if (image !== next) {
              image?.remove();
            }
            image = next;
            displayedFrame = {
              sequence: frame.sequence,
              frameWidth: next.naturalWidth,
              frameHeight: next.naturalHeight,
            };
            frameReceivedAt = performance.now();
            fitDevice();
            $('#placeholder').hidden = true;
            $('#overlay').hidden = true;
            $('#view').setAttribute('aria-busy', 'false');
            after = frame.sequence;
            showRate(state?.fps ?? 0);
          } catch (error) {
            if (running && generation === current) {
              fail(error);
            }
            return;
          }
        }
      }
      function start() {
        if (!config || ended || disposed || (!bridgeReady && !window.mobileCodexStandalone)) {
          return;
        }
        running = true;
        displayedFrame = null;
        const current = ++generation;
        rendered = [];
        toggleLabel('暂停', 'pause');
        stopStream();
        $('#overlay').hidden = true;
        $('#rate').textContent = '等待首帧';
        $('#view').setAttribute('aria-busy', 'true');
        placeholder('正在接收画面', '首次连接可能需要几秒钟');
        setStatus('正在连接');
        if (window.mobileCodexStandalone) {
          const next = new Image();
          streamImage = next;
          next.alt = config.device.name + ' 实时屏幕';
          next.onload = () => {
            if (!running || generation !== current) {
              return;
            }
            $('#display').append(next);
            if (image !== next) {
              image?.remove();
            }
            image = next;
            fitDevice();
            $('#placeholder').hidden = true;
            $('#view').setAttribute('aria-busy', 'false');
            setStatus('实时', 'live');
          };
          next.onerror = () => fail(Error('画面连接中断，请重连'));
          next.src = config.streamUrl + '?t=' + Date.now();
        } else {
          void streamFrames(current, config.device.id);
        }
      }
      function mount(result) {
        const next = result?._meta?.mobileCodex;
        if (!next || disposed) {
          return;
        }
        stopViewing();
        image?.remove();
        image = null;
        config = next;
        restoreFrameSize(config.device);
        fitDevice();
        ended = false;
        clearInterval(statusTimer);
        statusTimer = setInterval(checkStatus, 1000);
        $('#device').textContent = config.device.name;
        updateControls();
        start();
      }
      async function checkStatus() {
        // While paused or disconnected, continue observing lifecycle without holding a frame viewer.
        if (
          !config ||
          ended ||
          disposed ||
          polling ||
          (!window.mobileCodexStandalone && (!bridgeReady || running))
        ) {
          return;
        }
        polling = true;
        const currentConfig = config;
        try {
          let state;
          if (window.mobileCodexStandalone) {
            const response = await fetch(config.statusUrl, { cache: 'no-store' });
            if (!response.ok) {
              throw Error('监看会话已结束');
            }
            state = await response.json();
          } else {
            state = (await callTool('monitor_status', { device: config.device.id }))
              .structuredContent;
          }
          if (currentConfig !== config || ended || disposed) {
            return;
          }
          if (state?.activeOperations === 0) {
            await finish();
            return;
          }
          if (state?.error && running) {
            throw Error(state.error);
          }
          if (window.mobileCodexStandalone && running) {
            $('#rate').textContent = '采集 ' + (state.fps ?? 0).toFixed(1) + ' fps';
            if (image) {
              setStatus('实时', 'live');
            }
          }
        } catch (error) {
          if (currentConfig === config && !ended && !disposed) {
            fail(error);
          }
        } finally {
          polling = false;
        }
      }
      let statusTimer = null;
      function teardown() {
        if (disposed) {
          return;
        }
        disposed = true;
        resizeObserver.disconnect();
        stopViewing();
        clearInterval(statusTimer);
        clearTimeout(feedbackTimer);
        for (const request of pending.values()) {
          clearTimeout(request.timer);
          request.reject(Error('监看面板已关闭'));
        }
        pending.clear();
        updateControls();
      }
      addEventListener('message', (event) => {
        if (event.source !== parent) {
          return;
        }
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') {
          return;
        }
        if (!message.method && message.id !== undefined && pending.has(message.id)) {
          const request = pending.get(message.id);
          clearTimeout(request.timer);
          pending.delete(message.id);
          message.error
            ? request.reject(Error(message.error.message))
            : request.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          mount(message.params);
        }
        if (message.method === 'ui/notifications/host-context-changed') {
          applyMode(message.params?.displayMode);
        }
        if (message.method === 'ui/resource-teardown') {
          teardown();
          parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');
        }
      });
      addEventListener('pagehide', teardown);
      addEventListener('openai:set_globals', (event) =>
        applyMode(event.detail?.globals?.displayMode),
      );
      $('#toggle').onclick = () => {
        if (running) {
          stopViewing();
          toggleLabel('继续', 'play');
          setStatus('已暂停', 'paused');
          $('#rate').textContent = '画面已暂停';
          placeholder('画面已暂停', '点击继续以接收设备画面');
          $('#overlay').textContent = '画面已暂停';
          $('#overlay').hidden = !image;
        } else {
          start();
        }
      };
      document.querySelectorAll('[data-button]').forEach((button) => {
        button.onclick = async () => {
          if (controlBusy || ended || !config) {
            return;
          }
          controlBusy = true;
          button.setAttribute('aria-busy', 'true');
          feedback(
            button.dataset.button === 'HOME'
              ? '正在返回主屏幕…'
              : button.dataset.button === 'VOLUME_UP'
                ? '正在提高音量…'
                : '正在降低音量…',
            true,
          );
          updateControls();
          try {
            const result = await callTool(
              'press_monitor_button',
              { device: config.device.id, button: button.dataset.button },
              25000,
            );
            feedback(
              button.dataset.button === 'HOME'
                ? result.structuredContent?.homeVerified
                  ? '已返回主屏幕'
                  : '已发送 Home 指令'
                : button.dataset.button === 'VOLUME_UP'
                  ? '已提高音量'
                  : '已降低音量',
            );
          } catch (error) {
            feedback('操作失败：' + error.message);
          } finally {
            controlBusy = false;
            button.removeAttribute('aria-busy');
            updateControls();
          }
        };
      });
      $('#display').addEventListener('pointerdown', (event) => {
        if (!canTap() || !event.isPrimary || event.button !== 0) {
          return;
        }
        pointerStart = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          time: performance.now(),
          width: displayedFrame.frameWidth,
          height: displayedFrame.frameHeight,
        };
        $('#display').setPointerCapture(event.pointerId);
      });
      $('#display').addEventListener('pointercancel', () => {
        pointerStart = null;
      });
      $('#display').addEventListener('pointermove', (event) => {
        if (
          pointerStart &&
          Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 8
        ) {
          pointerStart = null;
        }
      });
      $('#display').addEventListener('pointerup', async (event) => {
        const start = pointerStart;
        pointerStart = null;
        if (
          !canTap() ||
          !start ||
          start.id !== event.pointerId ||
          performance.now() - start.time > 500 ||
          Math.hypot(event.clientX - start.x, event.clientY - start.y) > 8 ||
          start.width !== displayedFrame.frameWidth ||
          start.height !== displayedFrame.frameHeight
        ) {
          return;
        }
        // Ignore the shell and any object-fit letterboxing, even while resizing.
        const rect = image.getBoundingClientRect();
        const scale = Math.min(rect.width / image.naturalWidth, rect.height / image.naturalHeight);
        const width = image.naturalWidth * scale;
        const height = image.naturalHeight * scale;
        const left = rect.left + (rect.width - width) / 2;
        const top = rect.top + (rect.height - height) / 2;
        const x = (event.clientX - left) / width;
        const y = (event.clientY - top) / height;
        if (x < 0 || x > 1 || y < 0 || y > 1 || !Number.isFinite(x + y)) {
          return;
        }
        const args = { device: config.device.id, x, y, ...displayedFrame };
        const ring = document.createElement('span');
        ring.className = 'tap-ring';
        ring.setAttribute('aria-hidden', 'true');
        const displayRect = $('#display').getBoundingClientRect();
        ring.style.left = event.clientX - displayRect.left + 'px';
        ring.style.top = event.clientY - displayRect.top + 'px';
        $('#display').append(ring);
        setTimeout(() => ring.remove(), 500);
        controlBusy = true;
        updateControls();
        feedback('正在操作…', true);
        try {
          await callTool('tap_monitor_screen', args, 20000);
          feedback('已点击');
        } catch (error) {
          feedback('操作失败：' + error.message);
        } finally {
          controlBusy = false;
          updateControls();
        }
      });
      (async () => {
        if (window.mobileCodexStandalone) {
          mount({ _meta: { mobileCodex: window.mobileCodexStandalone } });
          return;
        }
        try {
          const initialized = await rpc('ui/initialize', {
            appInfo: { name: 'mobile-use-codex', version: '__PLUGIN_VERSION__' },
            appCapabilities: {},
            protocolVersion: '2026-01-26',
          });
          if (disposed) {
            return;
          }
          bridgeReady = true;
          document.documentElement.dataset.hosted = 'true';
          applyMode(initialized?.hostContext?.displayMode);
          notify('ui/notifications/initialized', {});
          updateControls();
          if (config) {
            start();
          } else {
            setStatus('等待设备');
          }
        } catch (error) {
          if (!disposed) {
            fail(Error('无法连接 Codex：' + error.message));
          }
        }
      })();
    </script>
  </body>
</html>
